<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WAR ROOM — Admin Login</title>

    <link
        rel="stylesheet"
       href="/css/admin.css"
    > 

    <link rel="stylesheet" href="/css/warroom-modal.css?v=2">
</head>


<body>

    <main class="admin-page">


        <!-- =====================================
             ADMIN TOP BRAND
             ===================================== -->

        <div class="admin-top-brand">

            <div class="sq-logo">
                SQ
            </div>

            <div class="sq-name">
                Syntho<span>Quest</span>
            </div>

        </div>


        <!-- =====================================
             ADMIN LOGIN PANEL
             ===================================== -->

        <section class="admin-login-panel">


            <!-- WELCOME -->

            <div class="welcome-text">
                WELCOME TO
            </div>


            <!-- WAR ROOM -->

            <h1 class="war-room-title">

                <span>WAR</span> ROOM

            </h1>


            <!-- DECORATIVE LINE -->

            <div class="hero-line">

                <span></span>

                <div class="shield-symbol">
                    ★
                </div>

                <span></span>

            </div>


            <!-- ADMIN TAGLINE -->

            <p class="hero-tagline">

                ADMINISTRATOR
                <strong>ACCESS.</strong>

            </p>


            <!-- =================================
                 LOGIN HEADING
                 ================================= -->

            <div class="admin-heading">

                <h2>
                    ADMIN LOGIN
                </h2>

                <p>
                    Enter your administrator credentials
                    to access the WAR ROOM control panel.
                </p>

            </div>


            <!-- =================================
                 LOGIN FORM
                 ================================= -->

            <form
                class="admin-form"
                id="adminLoginForm"
            >


                <!-- USERNAME -->

                <div class="admin-field">

                    <label for="username">
                        USERNAME
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="admin-field">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="admin-submit"
                >

                    LOGIN TO WAR ROOM

                    <span>→</span>

                </button>


            </form>


            <!-- BACK TO HOME -->

            <a
                href="/"
                class="back-home"
            >

                ← BACK TO WAR ROOM

            </a>


        </section>


        <!-- =====================================
             FOOTER
             ===================================== -->

        <footer class="home-footer">

            SYNTHOQUEST PRIVATE LIMITED

        </footer>

            <script src="/js/warroom-modal.js?v=2"></script>
<script src="/js/admin.js"></script>
    </main>

</body>

</html>
